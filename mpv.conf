# --- General ---
profile=high-quality
keep-open=yes
save-position-on-quit=yes
autofit=50%
force-seekable=yes
loop=yes
osc=no
input-ipc-server=\.\pipe\mpvsocket
demuxer-lavf-o=fflags=+genpts
alang=en,eng
volume-max=200

# --- Window ---
window-dragging=yes
border=yes
title-bar=no

# --- Screenshots ---
screenshot-sw=yes
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=1
screenshot-jpeg-quality=95
screenshot-dir="E:\Virak\Pictures\Screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# --- Subtitles ---
# This is the startup look. It is deliberately identical to the
# [sub-font-inter] + [sub-style-clean] presets at the bottom of this file,
# so the switcher starts in a known state. If you change a value here,
# change it in that preset too (or just let the presets do the work).
sub-font="Inter SemiBold"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-bold=no
sub-pos=89
sub-border-size=1.5
sub-border-color="#000000"
sub-shadow-offset=1
sub-shadow-color="#40000000"
sub-back-color="#00000000"
sub-blur=0.2
sub-fix-timing=yes
blend-subtitles=no
# Force your styling even on embedded ASS subs
sub-ass-override=force

# Presets you save with the adjust panel's w key land in this file, and
# including it here turns them into real profiles you can cycle to.
# mpv ignores this line silently while that file does not exist yet.
# It has to stay ABOVE the [profile] blocks at the bottom: an include
# written inside a profile becomes one of that profile's options
# instead of a directive, and the presets never register.
include=~~/substyle-custom.conf

# --- Font (OSD) ---
osd-font="JetBrains Mono"
osd-border-size=1.6
osd-shadow-offset=1
osd-shadow-color="#80000000"


###############################################################################
#  SUBTITLE PRESETS
#
#  HOW THIS WORKS
#  A line like [name] starts a "profile": every option under it is stored,
#  not applied, until something applies it. So EVERYTHING BELOW THIS POINT
#  belongs to a profile -- keep normal options ABOVE this block.
#
#  There are two cycles:
#    [sub-font-*]   the typeface, nothing else
#    [sub-style-*]  a whole look: size / position / outline / shadow / box
#
#  Plain styles (Clean, Box, Big, Compact) leave your chosen font alone.
#  Signature styles (Crunchyroll, Netflix, Fansub, Retro) also set their own
#  font, because the font is what makes them recognisable. After one of those,
#  Alt+Right still swaps the typeface on top of it.
#
#  TO SWITCH  (see input.conf)
#    Alt+Right / Alt+Left   next / previous font
#    Alt+Up    / Alt+Down   next / previous style
#    Alt+i                  show what is currently active
#    Alt+a                  open the adjust panel: Up/Down picks a value,
#                           Left/Right changes it, w writes the result out
#                           as a preset block you can paste back in here
#  The cycle order is script-opts/substyle.conf, and the first name on
#  each line there is the default for that line.
#  The last used pair is remembered between sessions. With
#  default_on_subs=yes in that file, the default style is also put
#  back every time subtitles come on, so each video starts the same.
#
#  TO SAVE ONE YOU TWEAKED  (Alt+a, adjust, then)
#    s  save into the preset you are on, overwriting the block it
#       came from -- here for a built-in, substyle-custom.conf for a
#       saved one. Comments around the block are kept. A plain style
#       stays font-agnostic: sub-font is only written to a preset
#       that already had one.
#    w  save as a NEW preset, appended to substyle-custom.conf and
#       picked up at the end of the style cycle on the next launch.
#    x  delete the preset you are on, if it is one saved with w.
#       Built-ins are refused: their blocks here have comments worth
#       keeping, so removing one is a deliberate hand edit.
#  The first time either write happens, the file is copied to
#  <name>.before-substyle so there is always a way back.
#  To make a saved preset the default, put its name first on the
#  styles line in script-opts/substyle.conf; to give it a better name,
#  move the block into this file and rename it.
#
#  TO ADD ONE
#    1. Copy a block below, give it a new [name] and profile-desc.
#    2. Add that name to the matching line in script-opts/substyle.conf.
#  Every style preset sets the SAME list of options on purpose: a profile
#  only changes what it mentions, so an option one preset forgets would stay
#  stuck from the previous preset.
#
#  Font names must be the family name Windows knows, not the file name.
#  "TiresiasScreenfont" works; "Tiresias Screenfont" silently falls back.
#  Colors are "#RRGGBB" or "#AARRGGBB" -- AA is 00 transparent, FF opaque.
#  Sizes are relative to a 720p-tall window, so a size 74 style authored for
#  1080p becomes 74 / 1.5 = 49 here.
###############################################################################

# ------------------------------- Fonts -------------------------------

[sub-font-inter]
profile-desc=Inter SemiBold
sub-font="Inter SemiBold"

[sub-font-netflix]
profile-desc=Netflix Sans Medium
sub-font="Netflix Sans Medium"

[sub-font-opensans]
profile-desc=Open Sans SemiBold
sub-font="Open Sans SemiBold"

# Bundled in fonts/ -- designed for maximum legibility
[sub-font-atkinson]
profile-desc=Atkinson Hyperlegible Next
sub-font="Atkinson Hyperlegible Next"

# Bundled in fonts/ -- designed for low vision / TV screens
[sub-font-tiresias]
profile-desc=Tiresias Screenfont
sub-font="TiresiasScreenfont"

[sub-font-trebuchet]
profile-desc=Trebuchet MS
sub-font="Trebuchet MS"

[sub-font-jetbrains]
profile-desc=JetBrains Mono
sub-font="JetBrains Mono"

# ------------------------------ Styles -------------------------------
# The plain four: these do not touch sub-font.

[sub-style-clean]
profile-desc=Clean - thin outline, soft shadow
sub-ass-override=force
sub-scale=1
sub-font-size=32
sub-color="#FFFFFFFF"
sub-bold=no
sub-pos=89
sub-border-size=1.6
sub-border-color="#FF000000"
sub-shadow-offset=1
sub-shadow-color="#40000000"
sub-back-color="#00000000"
sub-blur=0

[sub-style-box]
profile-desc=Box - opaque plate behind the text
sub-ass-override=force
sub-scale=1
sub-font-size=32
sub-color="#FFFFFFFF"
sub-bold=no
sub-pos=90
sub-border-size=0
sub-border-color="#FF000000"
sub-shadow-offset=2.4
sub-shadow-color="#00000000"
sub-back-color="#70000000"
sub-blur=0

[sub-style-big]
profile-desc=Big - heavy outline, couch distance
sub-ass-override=force
sub-scale=1
sub-font-size=52
sub-color="#FFFFFFFF"
sub-bold=yes
sub-pos=91
sub-border-size=3
sub-border-color="#000000"
sub-shadow-offset=2
sub-shadow-color="#60000000"
sub-back-color="#00000000"
sub-blur=0.2

[sub-style-compact]
profile-desc=Compact - small, tucked to the bottom
sub-ass-override=force
sub-scale=1
sub-font-size=30
sub-color="#FFFFFFFF"
sub-bold=no
sub-pos=92
sub-border-size=1.6
sub-border-color="#FF000000"
sub-shadow-offset=1
sub-shadow-color="#40000000"
sub-back-color="#00000000"
sub-blur=0.2

# ---- Signature looks: these DO set their own font ----

# Crunchyroll: bold Trebuchet MS, black outline, and a hard offset copy of
# the glyph down-and-right that reads as extrusion depth. That depth is the
# shadow, and it only looks solid if the shadow colour is fully opaque
# (alpha FF) and the blur stays near zero -- blur turns it into a smudge.
# Their scripts are authored at 60pt/1080p, which is 40 here.
[sub-style-crunchyroll]
profile-desc=Crunchyroll - Trebuchet, outline + extrusion
sub-ass-override=force
sub-scale=1
sub-font="Trebuchet MS"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-bold=yes
sub-pos=94
sub-border-size=2.8
sub-border-color="#FF000000"
sub-shadow-offset=1.9
sub-shadow-color="#FF000000"
sub-back-color="#00000000"
sub-blur=0.1

# Netflix: bold Netflix Sans under a soft dark haze that spreads outwards
# in every direction rather than falling to one side. There is no such
# thing as a "glow" option -- it is a thin black outline pushed through
# sub-blur until its edge dissolves, with only a hint of downward offset.
# Keep the outline thin and the blur high; a thick blurred outline turns
# into a grey cloud. Written as "Netflix Sans" + bold so libass picks the
# real Bold face instead of faking one from Medium.
[sub-style-netflix]
profile-desc=Netflix - Netflix Sans, soft outward shadow
sub-ass-override=force
sub-scale=1
sub-font="Netflix Sans"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-bold=yes
sub-pos=93
sub-border-size=0.2
sub-border-color="#FF000000"
sub-shadow-offset=1
sub-shadow-color="#00000000"
sub-back-color="#00000000"
sub-blur=3.7

# The modern fansub house style, taken from GJM-Main:
#   Gandhi Sans 74, bold, outline 4, shadow 1.5, MarginV 50, at 1080p.
# Gandhi Sans is not installed here, so this uses Open Sans Bold, which is
# the other font that group of subs leans on. For the real thing: drop
# GandhiSans-Bold.ttf into the fonts/ folder next to this file (mpv loads
# it automatically, no install needed) and set sub-font="Gandhi Sans".
[sub-style-fansub]
profile-desc=Fansub - GJM style, bold with a wide outline
sub-ass-override=force
sub-scale=1
sub-font="Open Sans"
sub-font-size=36
sub-color="#FFFFFFFF"
sub-bold=yes
sub-pos=92
sub-border-size=1.9
sub-border-color="#FF000000"
sub-shadow-offset=1
sub-shadow-color="#B0000000"
sub-back-color="#00000000"
sub-blur=0.2

# The 2000s DVD / early-fansub look: Verdana bold, cream-yellow, thick
# black outline and nothing else.
[sub-style-retro]
profile-desc=Retro - DVD-era yellow Verdana
sub-ass-override=force
sub-scale=1
sub-font=Verdana
sub-font-size=30
sub-color="#FFF2D14B"
sub-bold=yes
sub-pos=90
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-offset=0
sub-shadow-color="#00000000"
sub-back-color="#00000000"
sub-blur=0

# Stop overriding: signs/karaoke and styled ASS subs render as the
# subtitle author intended. The values below only affect plain SRT.
[sub-style-native]
profile-desc=Native - use the subtitle's own styling
sub-ass-override=no
sub-scale=1
sub-font="Inter SemiBold"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-bold=no
sub-pos=89
sub-border-size=1.5
sub-border-color="#000000"
sub-shadow-offset=1
sub-shadow-color="#40000000"
sub-back-color="#00000000"
sub-blur=0.2
