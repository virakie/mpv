# --- Subtitles ---
g add sub-scale +0.1                           # Subtitles bigger
f add sub-scale -0.1                           # Subtitles smaller
t add sub-pos -1                               # Subtitles up
r add sub-pos +1                               # Subtitles down

# --- Subtitle presets ---
# Presets are the [sub-font-*] / [sub-style-*] blocks at the bottom of
# mpv.conf; the cycle order is script-opts/substyle.conf.
Alt+RIGHT script-binding substyle/next-font    # Next subtitle font
Alt+LEFT  script-binding substyle/prev-font    # Previous subtitle font
Alt+UP    script-binding substyle/next-style   # Next subtitle style
Alt+DOWN  script-binding substyle/prev-style   # Previous subtitle style
Alt+i     script-binding substyle/show         # Show the active font and style
Alt+a     script-binding substyle/adjust       # Adjust panel: tweak and save subtitle styles

# Jump straight to one preset instead of cycling -- uncomment and edit.
# Ctrl+1 script-message substyle-set style sub-style-clean
# Ctrl+2 script-message substyle-set style sub-style-crunchyroll
# Ctrl+3 script-message substyle-set style sub-style-native

# --- Seeking ---
RIGHT seek 2                                   # Forward 2 seconds
LEFT seek -2                                   # Back 2 seconds
] playlist-next                                # Next file
[ playlist-prev                                # Previous file

# --- Playback ---
= add speed 0.25                               # Speed up
- add speed -0.25                              # Slow down
UP add volume 1                                # Volume up
DOWN add volume -1                             # Volume down

# --- Scripts ---
# Toggle crop (vlccrop script)
c script-binding vlccrop/toggle_crop           # Crop to fill the screen
# Look up a word in the subtitle line on screen (was: d ignore)
d script-binding subdict/lookup                # Look up a word in the subtitle line
# Discord rich presence: toggle, and re-pick if it guessed the wrong show.
# Not Alt+Shift+P: PrinterTool.ahk takes that one globally.
Alt+p script-binding presence/toggle           # Discord rich presence on/off
Alt+o script-binding presence/repick           # Re-pick the show for Discord

# --- Ignore ---
w ignore
o ignore
p ignore
j ignore
l ignore
v ignore
a ignore

# --- uosc interface ---
TAB          script-binding track_picker/open      # Pick the audio and subtitle track
MBTN_RIGHT   script-binding uosc_menu/menu-at-cursor # Main menu, opened where the pointer is
MENU         script-binding uosc_menu/menu         # Main menu, centred
Alt+c        script-binding chapters_menu/menu     # Every chapter: jump, add, rename, delete
Alt+t        script-binding uosc/subtitles         # Pick the subtitle track
Alt+y        script-binding uosc/audio             # Pick the audio track
Ctrl+TAB     script-binding uosc/toggle-ui         # Show or hide the whole uosc interface

# --- moonlight-mpv extras ---
F6         script-binding keybind-visualizer   # On-screen keyboard of every binding, searchable
F4         script-binding sub-seek-list        # Every subtitle line as a list; filter and jump
F5         script-binding restart-mpv          # Reload this file at the same spot, applying config edits
F11        script-binding chapter-skip         # Auto-skip opening/ending chapters on/off
Alt+F5     script-binding reset-all            # Zoom, speed, delays and colours back to default
Ctrl+LEFT  no-osd sub-seek -1                  # Previous subtitle line
Ctrl+RIGHT no-osd sub-seek +1                  # Next subtitle line
Ctrl+DOWN  no-osd sub-seek 0                   # Replay the current subtitle line

