# --- Subtitles ---
g add sub-scale +0.1
f add sub-scale -0.1
t add sub-pos -1
r add sub-pos +1

# --- Subtitle presets ---
# Presets are the [sub-font-*] / [sub-style-*] blocks at the bottom of
# mpv.conf; the cycle order is script-opts/substyle.conf.
Alt+RIGHT script-binding substyle/next-font
Alt+LEFT  script-binding substyle/prev-font
Alt+UP    script-binding substyle/next-style
Alt+DOWN  script-binding substyle/prev-style
Alt+i     script-binding substyle/show
Alt+a     script-binding substyle/adjust

# Jump straight to one preset instead of cycling -- uncomment and edit.
# Ctrl+1 script-message substyle-set style sub-style-clean
# Ctrl+2 script-message substyle-set style sub-style-crunchyroll
# Ctrl+3 script-message substyle-set style sub-style-native

# --- Seeking ---
RIGHT seek 2
LEFT seek -2
] playlist-next
[ playlist-prev

# --- Playback ---
= add speed 0.25
- add speed -0.25
UP add volume 1
DOWN add volume -1

# --- Scripts ---
# Toggle crop (vlccrop script)
c script-binding vlccrop/toggle_crop
# Look up a word in the subtitle line on screen (was: d ignore)
d script-binding subdict/lookup
# Discord rich presence: toggle, and re-pick if it guessed the wrong show.
# Not Alt+Shift+P: PrinterTool.ahk takes that one globally.
Alt+p script-binding presence/toggle
Alt+o script-binding presence/repick

# --- Ignore ---
w ignore
o ignore
p ignore
j ignore
l ignore
v ignore
a ignore
