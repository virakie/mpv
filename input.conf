# --- Subtitles ---
# Increase subtitle font size
h add sub-scale +0.1
# Decrease subtitle font size
f add sub-scale -0.1
# Move subtitles up
t add sub-pos -1
# Move subtitles down
r add sub-pos +1

# --- Seeking ---
# Seek forward 2s
RIGHT seek 2
# Seek backward 2s
LEFT seek -2

# --- Playback speed ---
# Increase speed
] add speed 0.5
# Decrease speed
[ add speed -0.5

# --- Scripts ---
# Toggle crop (vlccrop script)
c script-binding vlccrop/toggle_crop