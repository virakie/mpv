# Start with presence already on (yes/no).
enabled=no

# TMDB api key. Leave empty to use TVmaze instead: no signup needed, but it
# only knows TV, so films fall back to whatever the filename said.
#
# Do not put a real key here: this file is in a public repo. Put it in
# presence-key.txt next to mpv.conf instead, which is git-ignored.
tmdb_key=

# What to publish. The switches blank a placeholder; the templates below
# decide where each one goes.
show_timestamps=yes
show_year=yes
show_episode=yes
# Episode titles are spoilers, so off by default.
show_episode_title=no

# The card, top to bottom:
#   Watching <header>
#   <bold>
#   <sub>
#   progress bar
#
# Placeholders: {title} {year} {season} {episode} {episode_title} {director}
# Pieces are separated by " - ". A piece whose placeholders all came up empty
# is dropped, so a film with no known director just reads "(1996)".
header_series=a Series
header_film=a Film
bold_series={title}
bold_film={title}
sub_series=({year}) - S{season}:E{episode} - {episode_title}
sub_film=({year}) - {director}

# Appended to the sub line while paused. Empty to show nothing.
paused_suffix= - Paused

# Ask which title you meant when the match looks weak.
ask_when_unsure=yes

# A search hit scoring below this counts as unsure (0-1).
confident_score=0.75

# Seconds to wait on the network.
timeout=8

# Size of the picker text, out of 720.
osd_size=20

# Drive the prebuilt rich-presence.dll by overriding the media title.
# Turning this off leaves the mpv window title alone, but then only a custom
# build of the plugin can show the name.
drive_plugin=no

# Name the director on films. Needs a TMDB key.
show_director=yes
