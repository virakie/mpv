# Text size for the word strip and definition panel (out of 720).
font_size=20

# How many senses to show per word.
max_definitions=3

# Wrap definitions at this many characters.
wrap_at=62

# Seconds to wait on the network before giving up.
timeout=8

# The offline dictionary, used when the API cannot be reached.
# Set offline_file empty to turn the fallback off.
offline_file=subdict-words.tsv
morph_file=subdict-morph.tsv

# Show the IPA pronunciation next to the word (online answers only).
show_pronunciation=no
