# Cycle order for the subtitle preset keys.
#   Alt+Right / Alt+Left   walk the fonts line
#   Alt+Up    / Alt+Down   walk the styles line
# Names must match the [profile] blocks at the bottom of mpv.conf.
#
# THE FIRST NAME ON EACH LINE IS THAT LINE'S DEFAULT: it is what you start
# on when there is no remembered choice. Move a name to the front to make it
# your default. With persist=yes below, whatever you last switched to wins
# over that, so cycling to a preset and quitting also makes it the default.
#
# In the adjust panel, s overwrites the preset you are on, w saves a new
# one, and x deletes a saved one.
#
# Presets you save with the adjust panel's w key do NOT need to be listed
# here -- they are found automatically and added to the end of the styles
# cycle. List one here only to place it somewhere other than last, such as
# at the front to make it the default.

fonts=sub-font-inter,sub-font-netflix,sub-font-opensans,sub-font-atkinson,sub-font-tiresias,sub-font-trebuchet,sub-font-jetbrains

styles=sub-style-fansub,sub-style-clean,sub-style-box,sub-style-crunchyroll,sub-style-netflix,sub-style-retro,sub-style-big,sub-style-compact,sub-style-native

# Remember the last used preset between sessions (yes/no).
persist=yes

# Put the default style back every time subtitles come on -- a new file, or
# switching sub track. So every video starts on the default no matter what
# you cycled to while watching the last one.
#
# The default is the FIRST name on the styles line above.
#
# This outranks persist above: your last choice is still remembered and
# still restored at startup, but the first subtitle track that loads
# replaces it with the default. Set this to no if you would rather have the
# style you last switched to carry across files.
default_on_subs=yes

# How long the preset name stays on screen, in seconds.
osd_duration=2

# Text size for this script's messages and the adjust panel.
# mpv's own OSD default is 55; lower this to shrink, raise to enlarge.
osd_size=20
