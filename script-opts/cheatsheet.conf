# cheatsheet.lua -- the ? shortcut sheet
# Descriptions come from the "# comment" after each line in input.conf.

# Text size, out of a 720-tall screen like the other panels
font_size=16
# 0 shows the video untouched behind the sheet, 1 hides it
backdrop_opacity=0.82
# Longer descriptions are cut short with an ellipsis
max_description=46
# Play/Stop/Volume keys on media keyboards and remotes
show_media_keys=no
# Mac Cmd-key bindings some scripts add on every platform
show_meta_keys=no
